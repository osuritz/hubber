excluded:
  - .build
  - .claude

opt_in_rules:
  - array_init
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - fallthrough
  - first_where
  - flatmap_over_map_reduce
  - last_where
  - literal_expression_end_indentation
  - multiline_arguments
  - multiline_function_chains
  - multiline_parameters
  - operator_usage_whitespace
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - yoda_condition

disabled_rules:
  - todo

line_length:
  warning: 150
  error: 200

file_length:
  warning: 800
  error: 1200

identifier_name:
  min_length:
    warning: 1
  excluded:
    - id
    - h
    - m
    - x
    - y

type_body_length:
  warning: 400
  error: 600
