name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Cancel any in-flight run for the same ref so we don't burn macOS minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# contents: write — create/upload GitHub Releases AND push the regenerated
# appcast.xml back to main (GitHub Pages serves it from /docs).
permissions:
  contents: write

jobs:
  release:
    # macos-26 ships Xcode 26 / Swift 6.3, which this project requires.
    # macos-latest currently pins Swift 6.1 and rejects valid 6.3-only code.
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + persisted credentials so the appcast step can push to main.
          fetch-depth: 0

      - name: Show toolchain
        run: swift --version

      # Sparkle requires a STABLE signing identity (ad-hoc trips Library Validation).
      # Import the self-signed cert into a throwaway keychain and expose its name as
      # HUBBER_SIGN_IDENTITY so make-app.sh signs the release build with it.
      - name: Import signing certificate
        env:
          P12_B64: ${{ secrets.HUBBER_SIGNING_P12 }}
          P12_PASSWORD: ${{ secrets.HUBBER_SIGNING_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/hubber.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          echo "$P12_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          # Prepend our keychain to the user search list so codesign resolves the identity.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed s/\"//g)
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "HUBBER_SIGN_IDENTITY=Hubber Self-Signed" >> "$GITHUB_ENV"

      - name: Assemble Hubber.app and package artifacts
        env:
          # Injected into Info.plist by make-app.sh so the build is auto-update capable.
          SPARKLE_FEED_URL: ${{ vars.SPARKLE_FEED_URL }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
          # HUBBER_SIGN_IDENTITY comes from the import step via $GITHUB_ENV.
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Building release version $VERSION"
          make dist VERSION="$VERSION"

      - name: List artifacts
        run: ls -lh dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/Hubber.dmg \
            dist/Hubber.zip \
            --generate-notes \
            --title "Hubber $GITHUB_REF_NAME"

      # Sign the zip with the EdDSA private key and regenerate the appcast, then
      # publish it to /docs on main (GitHub Pages → SUFeedURL). The appcast always
      # advertises the latest release; Sparkle updates clients to it.
      - name: Generate and publish appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          SPARKLE_BIN="$(find .build/artifacts -name 'generate_appcast' | head -1)"
          mkdir -p "$RUNNER_TEMP/archives"
          cp dist/Hubber.zip "$RUNNER_TEMP/archives/"
          echo "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle_key.pem"
          "$SPARKLE_BIN" \
            --ed-key-file "$RUNNER_TEMP/sparkle_key.pem" \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/" \
            --link "https://github.com/${GITHUB_REPOSITORY}" \
            -o "$RUNNER_TEMP/appcast.xml" \
            "$RUNNER_TEMP/archives/"
          rm -f "$RUNNER_TEMP/sparkle_key.pem"

          # Publish to /docs on main (Pages source). Tags are cut from main, so
          # switching to main lands us at or ahead of this tag's commit.
          git fetch origin main
          git switch main 2>/dev/null || git checkout -B main origin/main
          mkdir -p docs
          cp "$RUNNER_TEMP/appcast.xml" docs/appcast.xml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/appcast.xml
          git commit -m "ci: update Sparkle appcast for ${GITHUB_REF_NAME}" || { echo "appcast unchanged"; exit 0; }
          git push origin main
