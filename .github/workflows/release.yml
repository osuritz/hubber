name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Cancel any in-flight run for the same ref so we don't burn macOS minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Needed so the job can create/upload GitHub Releases.
permissions:
  contents: write

jobs:
  release:
    # macos-26 ships Xcode 26 / Swift 6.3, which this project requires.
    # macos-latest currently pins Swift 6.1 and rejects valid 6.3-only code.
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Show toolchain
        run: swift --version

      - name: Assemble Hubber.app and package artifacts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Building release version $VERSION"
          make dist VERSION="$VERSION"

      # install.sh verifies Hubber.zip against Hubber.zip.sha256 from the same release.
      - name: Write checksums
        working-directory: dist
        run: |
          shasum -a 256 Hubber.zip > Hubber.zip.sha256
          shasum -a 256 Hubber.dmg > Hubber.dmg.sha256
          cat Hubber.zip.sha256 Hubber.dmg.sha256

      - name: List artifacts
        run: ls -lh dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/Hubber.dmg \
            dist/Hubber.zip \
            dist/Hubber.zip.sha256 \
            dist/Hubber.dmg.sha256 \
            --generate-notes \
            --title "Hubber $GITHUB_REF_NAME"
