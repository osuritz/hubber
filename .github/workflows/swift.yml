# This workflow will build a Swift project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-swift

name: Swift

# Temporarily set to manual-only (workflow_dispatch) to cut macOS CI spend
# while the project is under heavy active development. macos-26 runners bill
# at 10x, and automatic runs on every push/PR were the main cost driver.
# Re-enable the push/pull_request triggers below when development settles.
on:
  workflow_dispatch:
  # push:
  #   branches: [ "main" ]
  # pull_request:
  #   branches: [ "main" ]

# Cancel superseded runs on the same ref. macOS minutes bill at 10x, and an
# active agent pushes frequently, so we don't want stacked redundant runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # Pin to macos-26 (Xcode 26 / Swift 6.3), the toolchain this project targets
    # per AGENTS.md and uses locally. macos-latest (currently macos-15) ships
    # Xcode 16.4 / Swift 6.1, which rejects valid Swift 6.2+ actor-isolation in
    # the test target ("passes locally, fails in CI").
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build -v

      - name: Run tests
        run: swift test -v

      - name: SwiftLint
        run: |
          brew list swiftlint >/dev/null 2>&1 || brew install swiftlint
          make lint

      - name: SwiftFormat (lint mode)
        run: |
          brew list swiftformat >/dev/null 2>&1 || brew install swiftformat
          swiftformat --lint Sources/ Tests/
